<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="PDF 또는 PPTX를 A4 가로, 4슬라이드 유인물 PDF로 변환합니다.">
  <title>PDF·PPTX 유인물 변환</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <main>
    <section class="upload-section" aria-labelledby="upload-title">
      <h1 id="upload-title">파일 업로드</h1>
      <div id="dropzone" class="dropzone">
        <button type="button" id="choose" class="primary">파일 선택</button>
        <div class="upload-info"><p>또는 파일을 여기에 끌어 놓으세요.</p><p>PDF, PPTX · 최대 50MiB</p></div>
        <input id="file" type="file" accept=".pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
      </div>
      <div id="progress" class="progress" hidden aria-live="polite">
        <div class="status-line"><strong id="progress-title">파일을 올리고 있어요</strong><button id="cancel" type="button">취소</button></div>
        <p id="progress-detail"></p>
        <p id="cold-note" hidden>절전 중인 서버를 준비하는 데 약 1분 이상 걸릴 수 있어요.</p>
      </div>
      <p id="error" class="notice error" role="alert" hidden></p>
    </section>

    <section id="result" class="result-section" hidden aria-labelledby="result-title">
      <h2 id="result-title">미리보기 및 다운로드</h2>
      <p id="result-summary" class="result-summary"></p>
      <p id="warning" class="notice warning" role="status" hidden></p>
      <div class="viewer-toolbar">
        <div class="page-controls"><button id="prev" type="button" aria-label="이전 페이지">이전</button><span id="page-label" aria-live="polite">1 / 3</span><button id="next" type="button" aria-label="다음 페이지">다음</button></div>
        <label class="zoom-label">배율 <select id="zoom" aria-label="미리보기 배율"><option value="fit">화면에 맞게</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
      </div>
      <div id="viewer" class="viewer" tabindex="0" aria-label="변환된 PDF 미리보기. 확대하면 좌우로 스크롤할 수 있습니다."><canvas id="pdf-canvas" aria-label="변환된 PDF 페이지"></canvas><p id="preview-status" role="status">PDF를 불러오고 있어요…</p></div>
      <p id="preview-error" class="notice error" hidden></p>
      <div class="download-area"><div class="filename-field"><label for="filename">파일명</label><div class="filename-input"><input id="filename" type="text" maxlength="120" placeholder="20100 홍길동" autocomplete="off"><span>.pdf</span></div></div><button id="download" class="primary" type="button">PDF 다운로드</button></div>
    </section>

    <section class="usage" aria-labelledby="usage-title">
      <h2 id="usage-title">사용방법</h2>
      <p>PDF 또는 PPTX 파일을 올리면 A4 가로 용지에 4슬라이드씩 자동 배치됩니다. 결과를 확인한 뒤 PDF를 다운로드하세요.</p>
    </section>
  </main>
</body>
</html>
